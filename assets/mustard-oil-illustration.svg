<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
<title id="title">Mustard oil with mustard seeds and flowers</title>
<desc id="desc">A golden glass bottle of mustard oil surrounded by mustard seeds and yellow mustard flowers on a warm cream background.</desc>
<defs>
 <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#f7f1df"/><stop offset="1" stop-color="#e6d6ae"/></linearGradient>
 <linearGradient id="glass" x2="1"><stop stop-color="#fff" stop-opacity=".8"/><stop offset=".22" stop-color="#fff" stop-opacity=".28"/><stop offset=".58" stop-color="#d7e1c9" stop-opacity=".22"/><stop offset="1" stop-color="#fff" stop-opacity=".68"/></linearGradient>
 <linearGradient id="oil" x2=".2" y2="1"><stop stop-color="#f8d86a"/><stop offset=".45" stop-color="#d99a22"/><stop offset="1" stop-color="#a96713"/></linearGradient>
 <linearGradient id="cap" x2="0" y2="1"><stop stop-color="#314f35"/><stop offset="1" stop-color="#183d2b"/></linearGradient>
 <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="22"/></filter>
 <g id="flower"><g fill="#f4ce35"><ellipse cy="-15" rx="8" ry="15"/><ellipse cy="15" rx="8" ry="15"/><ellipse cx="-15" rx="15" ry="8"/><ellipse cx="15" rx="15" ry="8"/><ellipse cx="-11" cy="-11" rx="8" ry="14" transform="rotate(-45 -11 -11)"/><ellipse cx="11" cy="11" rx="8" ry="14" transform="rotate(-45 11 11)"/><ellipse cx="11" cy="-11" rx="8" ry="14" transform="rotate(45 11 -11)"/><ellipse cx="-11" cy="11" rx="8" ry="14" transform="rotate(45 -11 11)"/></g><circle r="6" fill="#8b621e"/></g>
</defs>
<rect width="1200" height="900" fill="url(#bg)"/>
<circle cx="600" cy="410" r="340" fill="#fff" opacity=".25"/>
<ellipse cx="605" cy="775" rx="300" ry="42" fill="#4c3b1e" opacity=".2" filter="url(#shadow)"/>
<!-- mustard sprigs -->
<g fill="none" stroke="#557344" stroke-width="8" stroke-linecap="round"><path d="M260 710 Q290 520 410 365 M950 730 Q895 540 805 360 M330 750 Q350 590 300 470"/></g>
<g fill="#6f914e"><ellipse cx="335" cy="545" rx="22" ry="54" transform="rotate(-42 335 545)"/><ellipse cx="380" cy="445" rx="20" ry="48" transform="rotate(36 380 445)"/><ellipse cx="870" cy="535" rx="22" ry="54" transform="rotate(42 870 535)"/><ellipse cx="830" cy="445" rx="20" ry="48" transform="rotate(-36 830 445)"/><ellipse cx="300" cy="620" rx="18" ry="42" transform="rotate(-52 300 620)"/></g>
<g><use href="#flower" x="395" y="340"/><use href="#flower" x="430" y="375" transform="scale(.8) translate(108 90)"/><use href="#flower" x="805" y="330"/><use href="#flower" x="850" y="380" transform="scale(.85) translate(150 67)"/><use href="#flower" x="285" y="445" transform="scale(.75) translate(95 148)"/></g>
<!-- bottle -->
<g>
 <path d="M520 255 Q520 220 550 210 L550 155 Q550 135 570 135 H630 Q650 135 650 155 V210 Q680 220 680 255 L720 690 Q725 755 660 765 H540 Q475 755 480 690 Z" fill="url(#glass)" stroke="#a8a17f" stroke-width="7"/>
 <path d="M505 490 Q600 470 695 490 L720 690 Q725 755 660 765 H540 Q475 755 480 690 Z" fill="url(#oil)" opacity=".94"/>
 <path d="M550 210 H650 V255 Q600 275 550 255 Z" fill="url(#oil)"/>
 <rect x="540" y="88" width="120" height="75" rx="12" fill="url(#cap)"/>
 <path d="M552 100 H648 M552 115 H648 M552 130 H648" stroke="#91a17e" stroke-width="4" opacity=".65"/>
 <path d="M530 275 Q510 475 520 680" stroke="#fff" stroke-width="14" opacity=".5" fill="none" stroke-linecap="round"/>
 <path d="M675 290 Q700 470 690 650" stroke="#fff" stroke-width="7" opacity=".35" fill="none" stroke-linecap="round"/>
 <rect x="505" y="430" width="190" height="170" rx="8" fill="#f8f2df" stroke="#d5bd7e" stroke-width="3"/>
 <text x="600" y="485" text-anchor="middle" fill="#183d2b" font-family="Georgia,serif" font-size="28" letter-spacing="3">RIDE NIPPY</text>
 <path d="M540 502 H660" stroke="#d6a64f" stroke-width="3"/>
 <text x="600" y="548" text-anchor="middle" fill="#183d2b" font-family="Arial,sans-serif" font-size="22" font-weight="700" letter-spacing="2">MUSTARD OIL</text>
 <text x="600" y="578" text-anchor="middle" fill="#718052" font-family="Arial,sans-serif" font-size="13" letter-spacing="2">PURE • GOLDEN • AROMATIC</text>
</g>
<!-- mustard seeds -->
<g fill="#4a3420"><circle cx="390" cy="760" r="9"/><circle cx="420" cy="790" r="7"/><circle cx="455" cy="755" r="8"/><circle cx="770" cy="770" r="8"/><circle cx="805" cy="790" r="7"/><circle cx="840" cy="750" r="9"/><circle cx="350" cy="805" r="6"/><circle cx="875" cy="810" r="6"/></g>
<g fill="#bd9140"><circle cx="435" cy="820" r="5"/><circle cx="790" cy="825" r="5"/><circle cx="375" cy="780" r="4"/><circle cx="830" cy="785" r="4"/></g>
</svg>
